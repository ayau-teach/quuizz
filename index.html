<!DOCTYPE html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Қазақстан тарихы — аралық бақылау куизі</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:8px 0 4px}p.s{color:var(--mu);margin:0 0 16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:10px 0 16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
.q{font-size:18px;font-weight:600;margin:0 0 14px}

.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.b.g{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.r{border-top:1px solid var(--bd);padding:10px 0;font-size:15px}.r b{color:var(--no)}.r span{color:var(--ok)}
.big{font-size:42px;font-weight:700;margin:6px 0}
</style></head><body><div class="w"><h1>Қазақстан тарихы: аралық бақылау</h1><p class="s">Жауап нұсқалары араласады, сондықтан мұқият оқыңыз.</p><div id="app"></div></div>

const $=s=>document.querySelector(s),app=$('#app');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let qs,i,score,wrong;
function home(){app.innerHTML=`<div class="c"><p>Базада <b>${Q.length}</b> сұрақ. Нешеуін шешесіз?</p><select id="n"><option value="${Q.length}">Барлығы (${Q.length})</option><option value="20">20</option><option value="10">10</option></select><br><button class="b" id="go">Бастау</button></div>`;
$('#go').onclick=()=>{const n=+$('#n').value;qs=sh(Q).slice(0,n).map(q=>({t:q[0],a:q[1],o:sh(q.slice(1))}));i=0;score=0;wrong=[];show()}}
function show(){const q=qs[i];app.innerHTML=`<div class="c"><div class="meta"><span>${i+1} / ${qs.length}</span><span>Ұпай: ${score}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><p class="q">${q.t}</p><div id="os"></div><div id="nx"></div></div>`;
q.o.forEach(o=>{const b=document.createElement('button');b.className='o';b.textContent=o;b.onclick=()=>pick(b,o);$('#os').append(b)})}
function pick(b,o){const q=qs[i];const ok=o===q.a;document.querySelectorAll('.o').forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok')});
if(ok)score++;else{b.classList.add('no');wrong.push({t:q.t,y:o,a:q.a})}
$('#nx').innerHTML=`<button class="b" id="nb">${i+1<qs.length?'Келесі →':'Нәтиже'}</button>`;$('#nb').onclick=()=>{i++;i<qs.length?show():end()}}
function end(){const p=Math.round(score/qs.length*100);app.innerHTML=`<div class="c"><div class="meta">Нәтиже</div><div class="big">${score} / ${qs.length} (${p}%)</div>${wrong.length?'<h3>Қателер:</h3>'+wrong.map(w=>`<div class="r">${w.t}<br>Сіз: <b>${w.y}</b><br>Дұрысы: <span>${w.a}</span></div>`).join(''):'<p>Мінсіз! 🎉</p>'}<button class="b" id="re">Қайта бастау</button></div>`;$('#re').onclick=home}
home();
</script></body></html>
